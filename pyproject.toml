[project]
name = "repdf"
version = "0.1.5"
description = "RePDF (Read the PDF): a desktop PDF reader with printing, search, bookmarks, OCR and page rearrangement."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]

dependencies = [
    "onnxruntime>=1.31.0,<2",
    "pillow>=11.0,<13",
    "pypdf[crypto]>=5.0,<7",
    "pypdfium2>=4.30,<6",
    "pyside6>=6.8,<7",
    "rapidocr[rtl]==3.10.0",
    "regex>=2024.11.6",
]

[project.urls]
Homepage = "https://github.com/codemee/repdf"
Repository = "https://github.com/codemee/repdf"
Issues = "https://github.com/codemee/repdf/issues"

[project.scripts]
repdf = "repdf.entrypoint:main"

[dependency-groups]
build = [
    "pyinstaller>=6.16,<7",
]
dev = [
    "pytest>=8.3,<10",
    "pytest-qt>=4.4,<5",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["scripts/**", "packaging/**", "third_party/**", "docs/**", ".github/workflows/**", "README.en.md", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
